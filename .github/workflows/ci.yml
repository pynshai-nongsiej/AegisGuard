name: reproducibility

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.80.0
      - name: Test
        run: make test
      - name: Build
        run: make build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag aegisguard:ci .
      - name: Smoke test CLI
        run: docker run --rm --entrypoint aegisguard aegisguard:ci evaluate 'git status'
